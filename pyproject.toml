[project]
name = "culturaeval"
version = "0.1.0"
description = "Controlled retrieval-context tests for cultural literary interpretation"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sujit Adhikari"}]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["culturaeval*"]
